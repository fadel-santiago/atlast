[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "atlast-rag"
version = "0.1.0"
description = "Local document indexing and similarity search foundation for ATLAST"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi==0.119.1",
  "pypdf==6.1.1",
  "python-multipart==0.0.20",
  "qdrant-client==1.15.1",
  "sentence-transformers==5.1.1",
  "uvicorn==0.38.0",
]

[project.scripts]
atlast = "atlast.cli:main"

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atlast"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
